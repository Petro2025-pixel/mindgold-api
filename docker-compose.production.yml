version: '3.8'

services:
  app:
    build: .
    container_name: mindgold-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/mindgold
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: mindgold-db
    restart: always
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: