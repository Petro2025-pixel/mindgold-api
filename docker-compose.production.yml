version: '3.8'

services:
  app:
    build: .
    container_name: mindgold-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/mindgold
      - JWT_SECRET=${JWT_SECRET}
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 500M
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: mindgold-db
    restart: always
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: